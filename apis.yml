name: The Cru
description: The Cru (now branded "The Cru Empowered by Luminary") is a membership
  community founded by Tiffany Dufu that matches women and allies into small peer-coaching
  accountability circles ("Crus") of 6-8 members who meet in monthly 90-minute gatherings
  to advance their personal and professional goals. It was acquired by Luminary, a
  New York City based professional community and coworking organization, and the
  thecru.com site now redirects to weareluminary.com/luminary-crus. This is a consumer
  community and coaching business, not a technical platform - it publishes no public
  API, developer portal, or SDK surface.
